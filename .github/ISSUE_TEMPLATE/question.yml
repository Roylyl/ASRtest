name: Question
description: Ask about building, testing, models, or project scope
title: "[Question]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include vulnerability details, recordings, signing data, personal paths, or device identifiers. Use the private security channel for vulnerabilities.
  - type: input
    id: revision
    attributes:
      label: ASRtest revision
      description: Commit SHA, tag, or Not applicable
