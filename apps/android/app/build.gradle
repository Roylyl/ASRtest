plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.roylyl.asrtest'
 sourceSets { main { assets.srcDirs = ['src/main/assets', '../../../shared/assets'] } }
 compileSdk 35
 defaultConfig { applicationId 'com.roylyl.asrtest'; minSdk 26; targetSdk 33; versionCode 1; versionName '1.0.0'; ndk { abiFilters 'arm64-v8a' } }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 androidResources { noCompress += ['onnx','bin','gguf','fst','mdl'] }
 packaging { jniLibs { useLegacyPackaging true; pickFirsts += ['**/libc++_shared.so'] } }
}
dependencies { implementation fileTree(dir: 'libs', include: ['*.aar','*.jar']) }
